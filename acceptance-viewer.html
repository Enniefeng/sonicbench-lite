<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>SonicBench · 管理员 Mapping 验收</title>
  <style>
    :root{--ink:#211a29;--muted:#786f82;--line:#e3dce8;--purple:#7253dc;--purple-soft:#f1edff;--red:#b63d4d}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:36px;color:var(--ink);background:radial-gradient(circle at 12% 8%,#eee9ff 0,transparent 34%),linear-gradient(135deg,#faf8fc,#f4f0f7);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(1320px,100%);margin:auto}.brand{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;display:grid;place-items:center;border-radius:13px;color:#fff;background:var(--purple);font-weight:900}.brand strong,.brand small{display:block}.brand small{margin-top:2px;color:var(--muted);font-size:12px}.hero{max-width:820px;margin:52px 0 30px}.eyebrow{margin:0;color:var(--purple);font-size:12px;font-weight:900;letter-spacing:.18em}.hero h1{margin:10px 0 12px;font-size:48px;line-height:1.08;letter-spacing:-.045em}.hero p{margin:0;color:var(--muted);font-size:15px;line-height:1.8}.input-card{padding:28px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.96);box-shadow:0 22px 70px rgba(50,35,65,.1)}.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.input-panel{display:flex;flex-direction:column;gap:10px;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fbf9fc}.input-panel span{font-size:17px;font-weight:850}.input-panel small{color:var(--muted)}textarea{width:100%;min-height:330px;resize:vertical;padding:14px;border:1px solid #d8d0df;border-radius:13px;color:var(--ink);background:#fff;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;outline:none}textarea:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(114,83,220,.1)}.actions{display:flex;justify-content:flex-end;margin-top:20px}.primary{min-height:48px;padding:0 22px;border:0;border-radius:13px;color:#fff;background:var(--purple);font-family:inherit;font-size:14px;font-weight:850;cursor:pointer}.primary:hover{filter:brightness(.96)}dialog{width:min(460px,calc(100% - 32px));padding:0;border:0;border-radius:22px;color:var(--ink);box-shadow:0 26px 90px rgba(35,24,46,.28)}dialog::backdrop{background:rgba(28,22,35,.45);backdrop-filter:blur(3px)}.dialog-body{padding:28px}.dialog-badge{display:inline-flex;padding:6px 10px;border-radius:999px;color:var(--red);background:#fff0f2;font-size:12px;font-weight:850}.dialog-body h2{margin:14px 0 8px;font-size:26px}.dialog-body p{margin:0;color:var(--muted);line-height:1.7}.dialog-actions{display:flex;justify-content:flex-end;margin-top:24px}.dialog-actions button{min-height:42px;padding:0 18px;border:0;border-radius:11px;color:#fff;background:var(--purple);font-family:inherit;font-size:13px;font-weight:800;cursor:pointer}@media(max-width:760px){body{padding:22px 14px}.hero{margin:36px 0 22px}.hero h1{font-size:36px}.input-card{padding:16px}.input-grid{grid-template-columns:1fr}textarea{min-height:230px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="mark">SB</span><span><strong>SonicBench</strong><small>Acceptance Review</small></span></div>
    <section class="hero"><p class="eyebrow">ACCEPTANCE REVIEW</p><h1>管理员 Mapping 验收</h1><p>导入管理员 Mapping，并逐条粘贴评测结果进行评测验收。</p></section>
    <form id="acceptance-form" class="input-card">
      <div class="input-grid">
        <label class="input-panel"><span>01 管理员 Mapping</span><small>粘贴 Mapping JSON</small><textarea id="mapping-input" required placeholder="在这里粘贴管理员 Mapping JSON"></textarea></label>
        <label class="input-panel"><span>02 单条评测结果 JSON</span><small>粘贴需要验收的单条结果</small><textarea id="result-input" required placeholder="在这里粘贴评测结果 JSON"></textarea></label>
      </div>
      <div class="actions"><button id="load-result" class="primary" type="submit">解析并进入验收 →</button></div>
    </form>
  </main>
  <dialog id="closed-dialog"><div class="dialog-body"><span class="dialog-badge">本轮评测已结束</span><h2>验收解析入口已关闭</h2><p>当前页面不再解析、展示或导出评测结果。</p><div class="dialog-actions"><button id="close-dialog" type="button">我知道了</button></div></div></dialog>
  <script>document.getElementById("acceptance-form").addEventListener("submit",event=>{event.preventDefault();document.getElementById("closed-dialog").showModal()});document.getElementById("close-dialog").addEventListener("click",()=>document.getElementById("closed-dialog").close());</script>
  <!-- Cloudflare Web Analytics --><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"eea4dfe6f095498b8e3ec03c14941504"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
