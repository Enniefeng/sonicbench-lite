<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>SonicBench · 验收入口已关闭</title>
  <style>
    :root{--ink:#211a29;--muted:#786f82;--line:#e3dce8;--purple:#7253dc;--bg:#f7f4fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--ink);background:radial-gradient(circle at 12% 8%,#eee9ff 0,transparent 34%),linear-gradient(135deg,#faf8fc,#f4f0f7);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.closed-card{width:min(620px,100%);padding:42px;border:1px solid var(--line);border-radius:26px;background:rgba(255,255,255,.96);box-shadow:0 22px 70px rgba(50,35,65,.12)}.brand{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;display:grid;place-items:center;border-radius:13px;color:#fff;background:var(--purple);font-weight:900}.brand strong,.brand small{display:block}.brand small{margin-top:2px;color:var(--muted);font-size:12px}.status{display:inline-flex;margin-top:34px;padding:6px 11px;border-radius:999px;color:#5f44c7;background:#f0ecff;font-size:12px;font-weight:800}h1{margin:14px 0 12px;font-size:36px;line-height:1.15;letter-spacing:-.035em}p{margin:0;color:var(--muted);font-size:15px;line-height:1.8}.notice{margin-top:24px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--bg);font-size:13px}.notice strong{display:block;margin-bottom:3px;color:var(--ink)}@media(max-width:600px){.closed-card{padding:28px 24px}h1{font-size:30px}}
  </style>
</head>
<body>
  <main class="closed-card">
    <div class="brand"><span class="mark">SB</span><span><strong>SonicBench</strong><small>Acceptance Review</small></span></div>
    <span class="status">本轮评测已结束</span>
    <h1>验收解析入口已关闭</h1>
    <p>当前页面不再接收 Mapping 或评测结果，也不会解析、展示或导出历史评测数据。</p>
    <div class="notice"><strong>需要查看历史结果？</strong>请联系本轮评测管理员，通过受控的内部验收流程处理。</div>
  </main>

</body>
</html>
